<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW SHOP - VIP SYSTEM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #7b2cbf; --cyan: #00f2ff; --bg: #050505; --card: #12141d; --text: #e2e8f0; --red: #ff4d4d; --green: #00ff88; --orange: #f39c12; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        
        /* AUTH UI */
        #auth-ui { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1a0b2e 0%, #050505 100%); }
        .auth-card { width: 90%; max-width: 400px; padding: 40px; background: var(--card); border-radius: 30px; border: 2px solid var(--primary); box-shadow: 0 0 30px rgba(123, 44, 191, 0.3); text-align: center; }

        /* HEADER */
        .header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 100; }
        
        /* SIDEBAR */
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--card); transition: 0.4s; z-index: 1000; padding: 25px; border-right: 1px solid var(--primary); }
        .sidebar.active { left: 0; }
        .menu-item { padding: 15px; cursor: pointer; color: white; display: flex; align-items: center; gap: 12px; border-radius: 10px; transition: 0.3s; margin-bottom: 5px; border-bottom: 1px solid #1e212e; }
        .menu-item:hover { background: rgba(123, 44, 191, 0.2); color: var(--cyan); }

        /* PRODUCT CARDS */
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid #2d334a; margin-bottom: 25px; position: relative; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 5px 15px rgba(123, 44, 191, 0.2); }
        
        .p-img { width: 100%; height: 220px; object-fit: cover; border-bottom: 1px solid #2d334a; }
        .badge { position: absolute; top: 15px; right: 15px; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 900; z-index: 10; text-transform: uppercase; }
        .badge-on { background: var(--green); color: #000; box-shadow: 0 0 15px var(--green); }
        .badge-off { background: var(--red); color: #fff; box-shadow: 0 0 15px var(--red); }

        .p-info { padding: 20px; }
        .input-pro { width: 100%; padding: 14px; margin: 10px 0; background: #080a12; border: 1px solid #333; color: white; border-radius: 12px; outline: none; }
        .btn-main { width: 100%; padding: 16px; background: var(--cyan); border: none; font-weight: 900; cursor: pointer; border-radius: 12px; color: #000; transition: 0.3s; text-transform: uppercase; }
        
        /* ZALO BUTTON */
        .zalo-fixed { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; z-index: 9999; background: #0084ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,132,255,0.6); animation: zoom 2s infinite ease-in-out; }
        .zalo-fixed img { width: 35px; height: 35px; }
        @keyframes zoom { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        /* UTILS */
        .price-big { font-size: 28px; color: var(--cyan); font-weight: 800; display: block; margin: 10px 0; }
        .key-view { background: #000; border: 1px dashed var(--green); padding: 15px; border-radius: 10px; color: var(--green); margin-top: 10px; font-family: monospace; word-break: break-all; }
    </style>
</head>
<body>

    <div id="auth-ui">
        <div class="auth-card">
            <h2 style="color:var(--cyan); letter-spacing: 2px;">SHADOW SYSTEM</h2>
            <input type="text" id="user" class="input-pro" placeholder="Tài khoản...">
            <input type="password" id="pass" class="input-pro" placeholder="Mật khẩu...">
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-main" onclick="handleLogin()">ĐĂNG NHẬP</button>
                <button class="btn-main" onclick="handleRegister()" style="background:var(--primary); color:white;">ĐĂNG KÝ</button>
            </div>
            <p id="auth-msg" style="margin-top: 15px; color: var(--red); font-weight: bold;"></p>
        </div>
    </div>

    <div id="main-app" style="display:none">
        <div class="header">
            <i class="fas fa-bars" onclick="toggleSidebar()" style="cursor:pointer; color:var(--cyan); font-size:22px;"></i>
            <div style="font-weight:900;">SHADOW <span style="color:var(--cyan)">SHOP</span></div>
            <div id="top-balance" style="color:var(--green); font-weight:bold; border: 1px solid var(--green); padding: 4px 12px; border-radius: 20px;">0đ</div>
        </div>

        <div id="sidebar" class="sidebar">
            <h3 id="display-name" style="text-align:center; color:var(--cyan)">Vinh</h3>
            <div class="menu-item" onclick="showPage('home')"><i class="fas fa-shopping-cart"></i> Cửa Hàng</div>
            <div class="menu-item" onclick="showPage('napthe')"><i class="fas fa-credit-card"></i> Nạp Thẻ Cào</div>
            <div class="menu-item" onclick="showPage('history')"><i class="fas fa-history"></i> Lịch Sử</div>
            <div id="admin-area" style="display:none">
                <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
                <div class="menu-item" onclick="showPage('admin-cards')" style="color:var(--orange)"><i class="fas fa-check"></i> Duyệt Thẻ</div>
                <div class="menu-item" onclick="showPage('admin-keys')" style="color:var(--cyan)"><i class="fas fa-box-open"></i> Thêm Hàng</div>
            </div>
            <div class="menu-item" onclick="logout()" style="color:var(--red); margin-top:30px;"><i class="fas fa-sign-out-alt"></i> Đăng xuất</div>
        </div>

        <div id="page-home" class="container">
            <div class="card">
                <div id="badge-Drip" class="badge">KIỂM TRA...</div>
                <img src="drip.jpg" class="p-img">
                <div class="p-info">
                    <h3>DRIP SILENT BYPASS</h3>
                    <select id="sel-Drip" class="input-pro" onchange="updatePrice('Drip')">
                        <option value="60000|1day">Gói 1 Ngày - 60.000đ</option>
                        <option value="100000|7day">Gói 7 Ngày - 100.000đ</option>
                        <option value="160000|30day">Gói 30 Ngày - 160.000đ</option>
                    </select>
                    <span id="price-Drip" class="price-big">60.000đ</span>
                    <button id="btn-Drip" class="btn-main" onclick="buyKey('Drip')">MUA NGAY</button>
                </div>
            </div>

            <div class="card">
                <div id="badge-Zygame" class="badge">KIỂM TRA...</div>
                <img src="zygame.jpg" class="p-img">
                <div class="p-info">
                    <h3>ZYGAME VIP SYSTEM</h3>
                    <select id="sel-Zygame" class="input-pro" onchange="updatePrice('Zygame')">
                        <option value="35000|1day">Gói 1 Ngày - 35.000đ</option>
                        <option value="55000|3day">Gói 3 Ngày - 55.000đ</option>
                        <option value="85000|7day">Gói 7 Ngày - 85.000đ</option>
                        <option value="130000|30day">Gói 30 Ngày - 130.000đ</option>
                    </select>
                    <span id="price-Zygame" class="price-big">35.000đ</span>
                    <button id="btn-Zygame" class="btn-main" onclick="buyKey('Zygame')">MUA NGAY</button>
                </div>
            </div>

            <div class="card">
                <div id="badge-Clone" class="badge">KIỂM TRA...</div>
                <img src="lv5.jpg" class="p-img">
                <div class="p-info">
                    <h3>ACC CLONE LV5 GOOGLE</h3>
                    <select id="sel-Clone" class="input-pro" onchange="updatePrice('Clone')">
                        <option value="2500|random">Acc LV5 Trắng - 2.500đ</option>
                    </select>
                    <span id="price-Clone" class="price-big">2.500đ</span>
                    <button id="btn-Clone" class="btn-main" onclick="buyKey('Clone')">MUA NGAY</button>
                </div>
            </div>
        </div>

        <div id="page-napthe" class="container" style="display:none">
            <div class="card p-info">
                <h3>NẠP THẺ CÀO (AUTO)</h3>
                <select id="card-type" class="input-pro" onchange="calcCard()">
                    <option value="Viettel">Viettel (87%)</option>
                    <option value="Vinaphone">Vinaphone (86%)</option>
                    <option value="Mobifone">Mobifone (80%)</option>
                    <option value="Garena">Garena (87.5%)</option>
                    <option value="Zing">Zing (87.5%)</option>
                    <option value="Vcoin">Vcoin (87%)</option>
                    <option value="Scoin">Scoin (67%)</option>
                </select>
                <select id="card-amount" class="input-pro" onchange="calcCard()">
                    <option value="10000">10.000đ</option><option value="20000">20.000đ</option>
                    <option value="50000">50.000đ</option><option value="100000">100.000đ</option>
                    <option value="200000">200.000đ</option><option value="500000">500.000đ</option>
                </select>
                <p id="card-res" style="color:var(--green); font-weight:bold; text-align:center;">Thực nhận: 8.700đ</p>
                <input type="text" id="seri" class="input-pro" placeholder="Số Seri">
                <input type="text" id="pin" class="input-pro" placeholder="Mã thẻ">
                <button class="btn-main" onclick="sendCard()" style="background:var(--green)">GỬI THẺ</button>
            </div>
        </div>

        <div id="page-history" class="container" style="display:none"><h2 style="text-align:center">LỊCH SỬ</h2><div id="hist-list"></div></div>
        <div id="page-admin-cards" class="container" style="display:none"><h2>THẺ CHỜ DUYỆT</h2><div id="adm-card-list"></div></div>
        <div id="page-admin-keys" class="container" style="display:none">
            <div class="card p-info">
                <h3>THÊM HÀNG</h3>
                <select id="adm-p-type" class="input-pro">
                    <option value="Drip_1day">Drip 1 Ngày</option>
                    <option value="Drip_7day">Drip 7 Ngày</option>
                    <option value="Drip_30day">Drip 30 Ngày</option>
                    <option value="Zygame_1day">Zygame 1 Ngày</option>
                    <option value="Zygame_3day">Zygame 3 Ngày</option>
                    <option value="Zygame_7day">Zygame 7 Ngày</option>
                    <option value="Zygame_30day">Zygame 30 Ngày</option>
                    <option value="Clone_random">Acc Clone</option>
                </select>
                <textarea id="adm-keys" class="input-pro" rows="5" placeholder="Mỗi món 1 dòng..."></textarea>
                <button class="btn-main" onclick="addStock()">NHẬP KHO</button>
            </div>
        </div>

        <a href="https://zalo.me/84364684151" target="_blank" class="zalo-fixed"><img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Icon_of_Zalo.svg"></a>
    </div>

    <script>
        const ADMIN = { u: "shadow+999", p: "HV0308hv" };
        const RATES = { "Viettel": 0.87, "Vinaphone": 0.86, "Mobifone": 0.80, "Garena": 0.875, "Zing": 0.875, "Vcoin": 0.87, "Scoin": 0.67 };

        let db = JSON.parse(localStorage.getItem('v7_shadow')) || {
            users: {}, cur: null, pending: [], orders: {},
            stock: { 
                "Drip_1day":[], "Drip_7day":[], "Drip_30day":[],
                "Zygame_1day":[], "Zygame_3day":[], "Zygame_7day":[], "Zygame_30day":[],
                "Clone_random":[] 
            }
        };

        function save() { localStorage.setItem('v7_shadow', JSON.stringify(db)); }

        function handleRegister() {
            let u = document.getElementById('user').value.trim(), p = document.getElementById('pass').value.trim();
            if(u.length<3 || db.users[u]) return alert("Lỗi!");
            db.users[u] = { pass: p, bal: 0 }; save(); alert("Đã ĐK!");
        }

        function handleLogin() {
            let u = document.getElementById('user').value.trim(), p = document.getElementById('pass').value.trim();
            if(u === ADMIN.u && p === ADMIN.p) { if(!db.users[u]) db.users[u] = { pass: p, bal: 9999999 }; db.cur = u; save(); start(); return; }
            if(db.users[u] && db.users[u].pass === p) { db.cur = u; save(); start(); } else alert("Sai!");
        }

        function start() {
            document.getElementById('auth-ui').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('display-name').innerText = db.cur;
            document.getElementById('admin-area').style.display = (db.cur === ADMIN.u) ? 'block' : 'none';
            updateUI(); showPage('home');
        }

        function logout() { db.cur = null; save(); location.reload(); }

        function updatePrice(p) {
            let val = document.getElementById(`sel-${p}`).value;
            let [price, time] = val.split('|');
            document.getElementById(`price-${p}`).innerText = parseInt(price).toLocaleString() + "đ";
            let count = db.stock[`${p}_${time}`].length;
            let b = document.getElementById(`badge-${p}`);
            b.innerText = count > 0 ? `CÒN HÀNG (${count})` : "HẾT HÀNG";
            b.className = count > 0 ? "badge badge-on" : "badge badge-off";
        }

        function buyKey(p) {
            let [price, time] = document.getElementById(`sel-${p}`).value.split('|');
            let keyPath = `${p}_${time}`;
            if(db.users[db.cur].bal < price) return alert("Hết tiền!");
            if(db.stock[keyPath].length === 0) return alert("Hết hàng!");
            
            let item = db.stock[keyPath].shift();
            db.users[db.cur].bal -= parseInt(price);
            if(!db.orders[db.cur]) db.orders[db.cur] = [];
            db.orders[db.cur].unshift({ name: p, type: time, content: item, date: new Date().toLocaleString() });
            save(); updateUI(); updatePrice(p); showPage('history');
        }

        function calcCard() {
            let t = document.getElementById('card-type').value, a = document.getElementById('card-amount').value;
            document.getElementById('card-res').innerText = `Thực nhận: ${Math.floor(a * RATES[t]).toLocaleString()}đ`;
        }

        function sendCard() {
            let t = document.getElementById('card-type').value, a = document.getElementById('card-amount').value, s = document.getElementById('seri').value, p = document.getElementById('pin').value;
            if(!s || !p) return;
            db.pending.push({ user: db.cur, type: t, amount: parseInt(a), seri: s, pin: p, rec: Math.floor(a * RATES[t]) });
            save(); alert("Đã gửi thẻ!");
        }

        function addStock() {
            let type = document.getElementById('adm-p-type').value;
            let keys = document.getElementById('adm-keys').value.split('\n').filter(k=>k);
            db.stock[type].push(...keys); save(); alert("Đã thêm!");
        }

        function approve(i) {
            let c = db.pending[i]; db.users[c.user].bal += c.rec; db.pending.splice(i,1);
            save(); renderAdminCards(); updateUI();
        }

        function renderAdminCards() {
            let h = "";
            db.pending.forEach((c, i) => { h += `<div class="card p-info"><b>${c.user} - ${c.type} ${c.amount}đ</b><br>PIN: ${c.pin}<br><button class="btn-main" onclick="approve(${i})">DUYỆT</button></div>`; });
            document.getElementById('adm-card-list').innerHTML = h || "Trống";
        }

        function showPage(p) {
            ['home', 'napthe', 'history', 'admin-cards', 'admin-keys'].forEach(id => { document.getElementById('page-'+id).style.display = (p===id ? 'block' : 'none'); });
            if(p==='home') { updatePrice('Drip'); updatePrice('Zygame'); updatePrice('Clone'); }
            if(p==='admin-cards') renderAdminCards();
            if(p==='history') renderHistory();
            document.getElementById('sidebar').classList.remove('active');
        }

        function renderHistory() {
            let h = "";
            (db.orders[db.cur]||[]).forEach(o => { h += `<div class="card p-info"><b>${o.name} (${o.type})</b><div class="key-view">${o.content}</div></div>`; });
            document.getElementById('hist-list').innerHTML = h || "Trống";
        }

        function updateUI() { document.getElementById('top-balance').innerText = db.users[db.cur].bal.toLocaleString() + "đ"; }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        window.onload = () => { if(db.cur) start(); };
    </script>
</body>
</html>
